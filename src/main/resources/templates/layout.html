<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en">

<head>
   <title layout:title-pattern="$CONTENT_TITLE - App">App</title>
   <meta charset="UTF-8">

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

   <style>
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: #343a40;
            color: white;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            color: #ccc;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #495057;
            color: white;
        }
    </style>
</head>

<body>

<div class="d-flex">

   <!-- Sidebar -->
   <div th:replace="fragments/sidebar :: sidebar"></div>

   <!-- Content -->
   <div class="flex-grow-1 p-4" layout:fragment="content">
   </div>

</div>

</body>
</html>
