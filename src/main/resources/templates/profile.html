<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" >
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
</head>
<body>
    <h2>Профиль</h2>
    <p>Пользователь: <span th:text="${username}"></span></p>

    <p>Роли:</p>
    <ul>
        <li th:each="r : ${roles}" th:text="${r.authority}"></li>
    </ul>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>

</body>
</html>
