<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
   <title>Регистрация</title>
   <meta charset="UTF-8"/>
</head>
<body>

   <h2>Регистрация</h2>

   <form th:action="@{/register}" th:object="${registerDto}" method="post">

      <div>
         <label for="username">Login:</label>
         <input type="text" th:field="*{username}" id="username"/>
         <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>

      <div>
         <label for="firstName">First name:</label>
         <input type="text" th:field="*{firstName}" id="firstName"/>
         <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
      </div>

      <div>
         <label for="lastName">Last name:</label>
         <input type="text" th:field="*{lastName}" id="lastName"/>
         <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
      </div>

      <div>
         <label for="email">Email:</label>
         <input type="email" th:field="*{email}" id="email"/>
         <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div>
         <label for="password">Пароль:</label>
         <input type="password" th:field="*{password}" id="password"/>
         <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div>
         <label for="confirmPassword">Подтвердите пароль:</label>
         <input type="password" th:field="*{confirmPassword}" id="confirmPassword"/>
         <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
      </div>

      <div th:if="${registrationError}">
         <p th:text="${registrationError}" style="color:red;"></p>
      </div>

      <button type="submit">Зарегистрироваться</button>
   </form>

   <p>
      Уже есть аккаунт?
      <a th:href="@{/oauth2/authorization/keycloak}">
         Войти
      </a>
   </p>

</body>
</html>
