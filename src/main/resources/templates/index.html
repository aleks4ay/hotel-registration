<!DOCTYPE html>
<html xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
</head>
<body>
    <h2>Главная страница</h2>

    <div>
        <a th:href="@{/oauth2/authorization/keycloak}">Войти / Зарегистрироваться</a>
    </div>

    <div>
        <a th:href="@{/profile}">Профиль</a>
    </div>

    <br/>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Выйти</button>
    </form>

    <div sec:authorize="hasRole('ADMIN')">
        <a href="/admin">Админка</a>
    </div>
</body>
</html>
